zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: c0b70fd9ee444036b3a7a0ed8a43690d
      template: 'xSNMP Ruckus ZD'
      name: 'xSNMP Ruckus ZD'
      description: |
        ## Overview
        
        Ruckus Zone Director 9.5
        ========================
        
        
        Tested with Zabbix 3.2.7 Ruckus Zone Director 9.5 Template.
        
        
        Tested with objects ID:
        
        
        SNMPv2-SMI::enterprises.25053.3.1.5.15 SNMPv2-SMI::enterprises.25053.3.1.5.3 SNMPv2-SMI::enterprises.25053.3.1.5.2 .1.3.6.1.4.1.25053.3.1.5.15 .1.3.6.1.4.1.25053.3.1.5.3 .1.3.6.1.4.1.25053.3.1.5.2
      groups:
        - name: MT
        - name: Templates
      items:
        - uuid: 8fefeef457c441cea5d04b44df13a56b
          name: 'AP''s - Total'
          type: CALCULATED
          key: ruckus.ap.total
          delay: 5m
          params: 'sum(last_foreach(/{HOST.HOST}/ruckus.ap.present[*]))'
        - uuid: 0f802365ea464a36bb09ba850b775c1d
          name: 'ZoneDirector CPU Utilization'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.25053.1.2.1.1.1.5.58.0
          key: ruckusZDSystemCPUUTIL.0
          delay: 10m
          history: 7d
          units: '%'
          tags:
            - tag: Application
              value: General
        - uuid: 369dcb8190f64b4c8581d7992c506ff3
          name: 'ZoneDirector MAC Adress'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.25053.1.2.1.1.1.1.3.0
          key: ruckusZDSystemMacAddr.0
          delay: 1d
          history: 91d
          value_type: CHAR
          inventory_link: MACADDRESS_A
          tags:
            - tag: Application
              value: General
        - uuid: 7e6df72c19da4d3b902dd53ca192e504
          name: 'ZoneDirector System Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.25053.1.2.1.1.1.1.9.0
          key: ruckusZDSystemModel.0
          delay: 1d
          history: 91d
          value_type: CHAR
          inventory_link: MODEL
          tags:
            - tag: Application
              value: General
        - uuid: c43a7130421744c88c4cf78661d178f0
          name: 'ZoneDirector Serial Number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.25053.1.2.1.1.1.1.15.0
          key: ruckusZDSystemSerialNumber.0
          delay: 1d
          history: 91d
          value_type: CHAR
          inventory_link: SERIALNO_A
          tags:
            - tag: Application
              value: General
        - uuid: 2605d536ab694bc19de5db2643c0ceda
          name: 'ZoneDirector Total Users'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.25053.1.2.1.1.1.15.30.0
          key: ruckusZDSystemStatsAllNumSta
          delay: 5m
          history: 7d
          units: Users
          tags:
            - tag: Application
              value: Users
        - uuid: df60f5e8d20241c5b2d5582112f38a60
          name: 'ZoneDirector Total Auth Clients'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.25053.1.2.1.1.1.15.2.0
          key: ruckusZDSystemStatsNumSta.0
          delay: 5m
          history: 7d
          units: Users
          tags:
            - tag: Application
              value: Users
        - uuid: 3d5e3c39bbf44cd59f986b3628958b97
          name: 'Total Rx Bytes'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.25053.1.2.1.1.1.15.6.0
          key: ruckusZDSystemStatsWLANTotalRxBytes
          delay: 5m
          history: 7d
          units: b
          preprocessing:
            - type: CHANGE_PER_SECOND
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Traffic
        - uuid: 0a89e7088ad0426e917d8c51ba27392a
          name: 'Total Tx Bytes'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.25053.1.2.1.1.1.15.9.0
          key: ruckusZDSystemStatsWLANTotalTxBytes
          delay: 5m
          history: 7d
          units: b
          preprocessing:
            - type: CHANGE_PER_SECOND
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Traffic
        - uuid: 4a110af888ae441f993ffa7b677d4eb9
          name: 'ZoneDirector System Version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.25053.1.2.1.1.1.1.18.0
          key: ruckusZDSystemVersion.0
          delay: 1d
          history: 91d
          value_type: CHAR
          inventory_link: OS
          tags:
            - tag: Application
              value: General
        - uuid: 2785b2fb84064037863cff4a7f269dd6
          name: 'SNMP availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          triggers:
            - uuid: 30b2b410b259435bb340a352657b9bf6
              expression: 'max(/xSNMP Ruckus ZD/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
      discovery_rules:
        - uuid: 77e9be8e65cb46e0afc3e49bba017025
          name: 'Ruckus APs'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.25053.1.2.2.1.1.2.1.1.1]'
          key: 'APRZ-[{#SNMPVALUE}]'
          delay: '3600'
          lifetime: 1d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 35393b65969f484f9262338d89c982ba
              name: 'AP $1 : Name'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.25053.1.2.2.1.1.2.1.1.2.{#SNMPINDEX}'
              key: 'APname[{#SNMPVALUE}]'
              delay: '300'
              value_type: CHAR
              tags:
                - tag: Application
                  value: Users
            - uuid: 9edbbb211c9643cf90a824ec154ba990
              name: 'AP Present [{#AP.NAME}]'
              type: DEPENDENT
              key: 'ruckus.ap.present[{#SNMPVALUE}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'return 1;'
              master_item:
                key: 'APname[{#SNMPVALUE}]'
            - uuid: 3249abf7411c4d33a56434674d76ffe0
              name: 'AP $1 : Auth Clients'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.25053.1.2.2.1.1.2.1.1.15.{#SNMPINDEX}'
              key: 'ruckusZDWLANAPNumSta[{#SNMPVALUE}]'
              delay: '300'
              units: Users
              tags:
                - tag: Application
                  value: Users
            - uuid: b661d0c696724ef997e309792df8f6b8
              name: 'AP Status $1'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.25053.1.2.2.1.1.2.1.1.3.{#SNMPINDEX}'
              key: 'ruckusZDWLANAPStatus[{#SNMPVALUE}]'
              delay: '360'
              value_type: CHAR
              valuemap:
                name: RuckusAPStatus
              tags:
                - tag: Application
                  value: 'Acces Points'
          trigger_prototypes:
            - uuid: 00c9ab7d52a842b280b1c7f6b6d0cfa8
              expression: '(last(/xSNMP Ruckus ZD/ruckusZDWLANAPStatus[{#SNMPVALUE}])<>1)or(find(/xSNMP Ruckus ZD/APname[{#SNMPVALUE}],,"regexp","^blablablabla$")=1)'
              name: 'AP Wi-Fi: {ITEM.VALUE2} is not available. Address: {#SNMPVALUE}'
              status: DISABLED
              priority: WARNING
              manual_close: 'YES'
              dependencies:
                - name: 'SNMP: No SNMP data collection'
                  expression: 'max(/xSNMP Ruckus ZD/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
        - uuid: 3b0d70098f6045dd96bfc3cd0f2e4841
          name: SSIDs
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.25053.1.2.2.1.1.1.1.1.200]'
          key: 'SSIDRZ-[{#SNMPVALUE}]'
          delay: '3600'
          lifetime: 1d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 384861f473e54fa4b151de7074a6aaeb
              name: 'ruckusZDWLANRxBytes $1'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.25053.1.2.2.1.1.1.1.1.14.{#SNMPINDEX}'
              key: 'ruckusZDWLANRxBytes-[{#SNMPVALUE}]'
              delay: '1200'
              units: b
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Traffic
            - uuid: e323d8c20cd042d5aa1a23ece75481a1
              name: 'ruckusZDWLANTxBytes $1'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.25053.1.2.2.1.1.1.1.1.16.{#SNMPINDEX}'
              key: 'ruckusZDWLANTxBytes-[{#SNMPVALUE}]'
              delay: '1200'
              units: b
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Traffic
            - uuid: d3bb36f90eb849d5a89d48a88a71debb
              name: 'SSID $1 : Name'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.25053.1.2.2.1.1.1.1.1.108.{#SNMPINDEX}'
              key: 'SSIDName-[{#SNMPVALUE}]'
              delay: '21600'
              value_type: CHAR
              tags:
                - tag: Application
                  value: SSID
        - uuid: ae6a585831d64de381b6a5a3ada12124
          name: 'ZoneDirector Eth'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.25053.1.2.1.1.1.18.2.1.2]'
          key: 'ZDEthName[{#SNMPVALUE}]'
          delay: '3600'
          lifetime: 1d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 2728d5020cda4f55b814be7f11f2168c
              name: 'Status $1'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.25053.1.2.1.1.1.18.2.1.5.{#SNMPINDEX}'
              key: 'ruckusZDEthStatus[{#SNMPVALUE}]'
              delay: '300'
              valuemap:
                name: ruckusZDEthStatus
              tags:
                - tag: Application
                  value: Interfaces
              trigger_prototypes:
                - uuid: 77c5f7c2e89d40d686910783a9e64a46
                  expression: 'last(/xSNMP Ruckus ZD/ruckusZDEthStatus[{#SNMPVALUE}])=2'
                  name: 'Port {#SNMPVALUE} is Down'
                  status: DISABLED
                  priority: HIGH
                  manual_close: 'YES'
                  dependencies:
                    - name: 'SNMP: No SNMP data collection'
                      expression: 'max(/xSNMP Ruckus ZD/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
      tags:
        - tag: Device
          value: ZD/AP
      valuemaps:
        - uuid: 92beb9b1c8794a398f6badac83bdecc9
          name: RuckusAPStatus
          mappings:
            - value: '0'
              newvalue: Disconnected
            - value: '1'
              newvalue: Connected
            - value: '2'
              newvalue: ApprovalPending
            - value: '3'
              newvalue: UpgradingFirmware
            - value: '4'
              newvalue: Provisioning
        - uuid: 3d97c3e57c2c443791ff119097370801
          name: ruckusZDEthStatus
          mappings:
            - value: '1'
              newvalue: Up
            - value: '2'
              newvalue: Down
  graphs:
    - uuid: 1e36636abf8249bf90c8b8e24bb63dcc
      name: 'Total Users'
      graph_items:
        - color: EE0000
          item:
            host: 'xSNMP Ruckus ZD'
            key: ruckusZDSystemStatsAllNumSta
        - sortorder: '1'
          color: 3333FF
          item:
            host: 'xSNMP Ruckus ZD'
            key: ruckusZDSystemStatsNumSta.0
    - uuid: 2988aa888b1f4abbb7eabdcb81295550
      name: 'Total Wifi Bandwidth'
      ymin_type_1: FIXED
      graph_items:
        - color: 00CC00
          calc_fnc: MAX
          item:
            host: 'xSNMP Ruckus ZD'
            key: ruckusZDSystemStatsWLANTotalRxBytes
        - sortorder: '1'
          color: 0000CC
          calc_fnc: MAX
          item:
            host: 'xSNMP Ruckus ZD'
            key: ruckusZDSystemStatsWLANTotalTxBytes
    - uuid: 1f3d0663816946acac65231743363ef1
      name: 'ZoneDirector CPU Utilization'
      graph_items:
        - color: 00C800
          item:
            host: 'xSNMP Ruckus ZD'
            key: ruckusZDSystemCPUUTIL.0
