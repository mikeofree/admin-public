zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: e5b939037c7745f894a032a98968ead4
      template: 'xSonicwall Firewall NSA 3xxx-4xxx'
      name: 'xSonicwall Firewall NSA 3xxx-4xxx'
      description: |
        ## Overview
        
        This will work on NSA 3x00 and 4x00 series firewalls.
      groups:
        - name: MT
      items:
        - uuid: f1f5942ad4604466a21609d86f97a614
          name: 'Current Connections'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.8741.1.3.1.2.0
          key: sonicwallCurrentConnections
          delay: 5m
          units: KC
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: Application
              value: 'SonicWall Performance'
        - uuid: 244aaa044be447478b715b78fdcbe3f3
          name: 'CPU Utilization'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.8741.1.3.1.3.0
          key: sonicwallCurrentCPUUtil
          delay: 10m
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: CHANGE_PER_SECOND
            - type: MULTIPLIER
              parameters:
                - '100'
          tags:
            - tag: Application
              value: 'SonicWall Performance'
          triggers:
            - uuid: aecd6f07f8004e6e92870739856db962
              expression: 'avg(/xSonicwall Firewall NSA 3xxx-4xxx/sonicwallCurrentCPUUtil,#5)>80'
              name: 'Sonicwall {HOSTNAME} - Usage of CPU over 80%'
              priority: AVERAGE
              description: 'CPU activity on Sonicwall is more than 95% during the last five checks'
              manual_close: 'YES'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
        - uuid: 535ea33d9223435f885896ba83013a07
          name: 'RAM Utilization'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.8741.1.3.1.4.0
          key: sonicwallCurrentRAMUtil
          delay: 10m
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: 'SonicWall Performance'
          triggers:
            - uuid: ff55b84565d24131b3a98d1f109f5cbb
              expression: 'avg(/xSonicwall Firewall NSA 3xxx-4xxx/sonicwallCurrentRAMUtil,#5)>80'
              name: 'Sonicwall {HOSTNAME} - Memory Usage Over 80%'
              priority: AVERAGE
              description: 'Memory usage on Sonicwall is more than 100% during the last five checks'
              manual_close: 'YES'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
        - uuid: 0d74d45664fd4a6da89ef93956147727
          name: 'Firmware Version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.8741.2.1.1.3.0
          key: SysmFirmwareVersion
          delay: 4h
          history: 90d
          value_type: CHAR
          inventory_link: OS
          tags:
            - tag: Application
              value: 'Sonicwall General'
        - uuid: 867faaa0a12347d9bb0dd50c90e934e1
          name: 'Sonicwall Model'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.8741.2.1.1.1.0
          key: SysmModel
          delay: 1d
          history: 90d
          value_type: CHAR
          inventory_link: MODEL
          tags:
            - tag: Application
              value: 'Sonicwall General'
        - uuid: 433c6a5e5a7a4ec890fe15ab3ce25d0a
          name: 'Sonicwall Serial Number'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.8741.2.1.1.2.0
          key: SysmSerialNumber
          delay: 1d
          history: 90d
          value_type: TEXT
          inventory_link: SERIALNO_A
          tags:
            - tag: Application
              value: 'Sonicwall General'
      discovery_rules:
        - uuid: 3f8ae0c7fbd14081b1828b591438356c
          name: 'Interfaces '
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},IF-MIB::ifDescr]'
          key: sonicwallifDescr
          delay: '90'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 1c0ff66d050c45b6aead7d80ebd5582e
              name: 'Incoming Traffic on interface $1'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifInOctets.{#SNMPINDEX}'
              key: 'ifInOctets.[{#SNMPVALUE}]'
              delay: '30'
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: 9ea70fea2cbc4b52a97e6492cf665fa9
              name: 'Outgoing Traffic on interface $1'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifOutOctets.{#SNMPINDEX}'
              key: 'ifOutOctets.[{#SNMPVALUE}]'
              delay: '30'
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
          graph_prototypes:
            - uuid: 2a022fc2fa444a29a4a00c6ccb514630
              name: 'Traffic on {#SNMPVALUE}'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: 'xSonicwall Firewall NSA 3xxx-4xxx'
                    key: 'ifInOctets.[{#SNMPVALUE}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: F63100
                  item:
                    host: 'xSonicwall Firewall NSA 3xxx-4xxx'
                    key: 'ifOutOctets.[{#SNMPVALUE}]'
      tags:
        - tag: Device
          value: Firewall
  graphs:
    - uuid: d5674c8c1fd34bd4b94bfc56cbb59579
      name: 'CPU %'
      show_work_period: 'NO'
      graph_items:
        - drawtype: GRADIENT_LINE
          color: 00AA00
          item:
            host: 'xSonicwall Firewall NSA 3xxx-4xxx'
            key: sonicwallCurrentCPUUtil
    - uuid: ea7b97c2ce744903a822c6fe17b60a96
      name: 'Current Connections'
      show_work_period: 'NO'
      graph_items:
        - color: '999900'
          item:
            host: 'xSonicwall Firewall NSA 3xxx-4xxx'
            key: sonicwallCurrentConnections
    - uuid: ec43227508294b96b7a4133f9e7a6a67
      name: 'RAM %'
      show_work_period: 'NO'
      graph_items:
        - drawtype: GRADIENT_LINE
          color: C80000
          item:
            host: 'xSonicwall Firewall NSA 3xxx-4xxx'
            key: sonicwallCurrentRAMUtil
