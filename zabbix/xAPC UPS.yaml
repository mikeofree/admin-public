zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: dabe931b93c949cc96656f481be09c4a
      template: 'xAPC UPS'
      name: 'xAPC UPS'
      description: |
        MIBs=
        
        HOST-RESOURCES-MIB
        PowerNet-MIB
        SNMPv2-MIB
      groups:
        - name: MT
      items:
        - uuid: 7e7514f997da4293a80b32b49630783c
          name: 'Battery capacity'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.3.1.0]'
          key: 'battery.capacity[upsHighPrecBatteryCapacity]'
          delay: 5m
          value_type: FLOAT
          units: '%'
          description: |
            MIB: PowerNet-MIB
            The remaining battery capacity expressed as
             percentage of full capacity.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
          triggers:
            - uuid: f36fcbb69a7e4899978ee7fed1a0e6d5
              expression: 'last(/xAPC UPS/battery.capacity[upsHighPrecBatteryCapacity]) < {$BATTERY.CAPACITY.MIN.WARN}'
              name: 'APC UPS: Battery has Low Capacity'
              event_name: 'APC UPS Symmetra: Battery has low capacity (below {$BATTERY.CAPACITY.MIN.WARN}%)'
              opdata: 'Current capacity: {ITEM.LASTVALUE1}'
              priority: HIGH
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 2e9de4f9506242c4b136c89c42fe80cf
          name: 'External battery packs count'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.2.5.0]'
          key: 'battery.external_packs_count[upsAdvBatteryNumOfBattPacks]'
          delay: 1h
          description: |
            MIB: PowerNet-MIB
            The number of external battery packs connected to the UPS. If
             the UPS does not use smart cells then the agent reports
             ERROR_NO_SUCH_NAME.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: inventory
        - uuid: 86d306e7b7374b22893cd0324c732328
          name: 'Battery last replace date'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.1.3.0]'
          key: 'battery.last_replace_date[upsBasicBatteryLastReplaceDate]'
          delay: 5m
          value_type: CHAR
          description: |
            MIB: PowerNet-MIB
            The date when the UPS system's batteries were last replaced
             in mm/dd/yy (or yyyy) format. For Smart-UPS models, this value
             is originally set at the factory. When the UPS batteries
             are replaced, this value should be reset by the administrator.
             For Symmetra PX 250/500 this OID is read-only and is configurable in the local display only.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: inventory
        - uuid: ed1b3bbbf29149588941ed48dc55524c
          name: 'Battery replace indicator'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.2.4.0]'
          key: 'battery.replace_indicator[upsAdvBatteryReplaceIndicator]'
          delay: 5m
          description: |
            MIB: PowerNet-MIB
            Indicates whether the UPS batteries need replacement.
          valuemap:
            name: 'PowerNet-MIB::upsAdvBatteryReplaceIndicator'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
          triggers:
            - uuid: e6ba6f5559c94426968289ac83411a9e
              expression: 'last(/xAPC UPS/battery.replace_indicator[upsAdvBatteryReplaceIndicator])=2'
              name: 'APC UPS: Battery needs Replacement'
              priority: HIGH
              description: 'A battery installed has an internal error condition.'
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: fcc600985b104e388208f2a3a9026e22
          name: 'Battery runtime remaining'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.2.3.0]'
          key: 'battery.runtime_remaining[upsAdvBatteryRunTimeRemaining]'
          delay: 5m
          value_type: FLOAT
          units: s
          description: |
            MIB: PowerNet-MIB
            The UPS battery run time remaining before battery
             exhaustion.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
        - uuid: 8bac942587ed4986879cdbfbc4476222
          name: 'Battery status'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.1.1.0]'
          key: 'battery.status[upsBasicBatteryStatus]'
          delay: 5m
          description: |
            MIB: PowerNet-MIB
            The status of the UPS batteries. A batteryLow(3) value
             indicates the UPS will be unable to sustain the current
             load, and its services will be lost if power is not restored.
             The amount of run time in reserve at the time of low battery
             can be configured by the upsAdvConfigLowBatteryRunTime.
             A batteryInFaultCondition(4)value indicates that a battery
             installed has an internal error condition.
          valuemap:
            name: 'PowerNet-MIB::upsBasicBatteryStatus'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: health
            - tag: component
              value: power
          triggers:
            - uuid: 9499b59df77f485cb0d937969f5f1336
              expression: 'last(/xAPC UPS/battery.status[upsBasicBatteryStatus])=4'
              name: 'APC UPS: Battery has an internal error condition'
              priority: AVERAGE
              description: 'A battery installed has an internal error condition.'
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: e1703d2e708f49318878f96049966f15
              expression: 'last(/xAPC UPS/battery.status[upsBasicBatteryStatus])=3'
              name: 'APC UPS: Battery is Low'
              priority: AVERAGE
              description: 'The UPS will be unable to sustain the current load, and its services will be lost if power is not restored.'
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 1b2cca5b7d114c9a899ab90d5e08db41
          name: 'Battery temperature'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.3.2.0]'
          key: 'battery.temperature[upsHighPrecBatteryTemperature]'
          delay: 5m
          value_type: FLOAT
          units: ℃
          description: |
            MIB: PowerNet-MIB
            The current internal UPS temperature in Celsius.
            Temperatures below zero read as 0.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: temperature
          triggers:
            - uuid: 142dfd2d03ed409781dc150cbf543631
              expression: 'min(/xAPC UPS/battery.temperature[upsHighPrecBatteryTemperature],{$TIME.PERIOD}) > {$BATTERY.TEMP.MAX.WARN}'
              name: 'APC UPS: Battery has High Temperature'
              event_name: 'APC UPS Symmetra: Battery has high temperature (over {$BATTERY.TEMP.MAX.WARN}℃ for {$TIME.PERIOD})'
              opdata: 'Current temperature: {ITEM.LASTVALUE1}'
              priority: HIGH
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: 9f5c8d9a965c46e5a8f40f008bbd09e5
          name: 'Battery voltage'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.3.4.0]'
          key: 'battery.voltage[upsHighPrecBatteryActualVoltage]'
          value_type: FLOAT
          units: V
          description: |
            MIB: PowerNet-MIB
            The actual battery bus voltage in Volts.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
        - uuid: c70318d3f0b949c1ab55eadb139a67a3
          name: 'Input fail cause'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.3.2.5.0]'
          key: 'input.fail[upsAdvInputLineFailCause]'
          description: |
            MIB: PowerNet-MIB
            The reason for the occurrence of the last transfer to UPS
            battery power.  The variable is set to:
            - noTransfer(1) -- if there is no transfer yet.
            - highLineVoltage(2) -- if the transfer to battery is caused
            by an over voltage greater than the high transfer voltage.
            - brownout(3) -- if the duration of the outage is greater than
            five seconds and the line voltage is between 40% of the
            rated output voltage and the low transfer voltage.
            - blackout(4) -- if the duration of the outage is greater than five
            seconds and the line voltage is between 40% of the rated
            output voltage and ground.
            - smallMomentarySag(5) -- if the duration of the outage is less
            than five seconds and the line voltage is between 40% of the
            rated output voltage and the low transfer voltage.
            - deepMomentarySag(6) -- if the duration of the outage is less
            than five seconds and the line voltage is between 40% of the
            rated output voltage and ground.  The variable is set to
            - smallMomentarySpike(7) -- if the line failure is caused by a
            rate of change of input voltage less than ten volts per cycle.
            - largeMomentarySpike(8) -- if the line failure is caused by
            a rate of change of input voltage greater than ten volts per cycle.
            - selfTest(9) -- if the UPS was commanded to do a self test.
            - rateOfVoltageChange(10) -- if the failure is due to the rate of change of
            the line voltage.
          valuemap:
            name: 'PowerNet-MIB::upsAdvInputLineFailCause'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
        - uuid: 8d6361a40cc545e88b9b3a7d9968a1cc
          name: 'Input frequency'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.3.3.4.0]'
          key: 'input.frequency[upsHighPrecInputFrequency]'
          value_type: FLOAT
          units: Hz
          description: |
            MIB: PowerNet-MIB
            The current input frequency to the UPS system in Hz.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
          triggers:
            - uuid: 0725cf6da41540e9aa3726ca97c1d979
              expression: 'min(/xAPC UPS/input.frequency[upsHighPrecInputFrequency],{$TIME.PERIOD}) > 0 and (min(/xAPC UPS/input.frequency[upsHighPrecInputFrequency],{$TIME.PERIOD}) > {$UPS.INPUT_FREQ.MAX.WARN} or max(/xAPC UPS/input.frequency[upsHighPrecInputFrequency],{$TIME.PERIOD}) < {$UPS.INPUT_FREQ.MIN.WARN})'
              name: 'APC UPS: Unacceptable Input Frequency'
              event_name: 'APC UPS Symmetra: Unacceptable input frequency (out of range {$UPS.INPUT_FREQ.MIN.WARN}-{$UPS.INPUT_FREQ.MAX.WARN}Hz for {$TIME.PERIOD})'
              opdata: 'Current frequency: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: 0d7a6b72a3744cbfbe51fe47e14f56aa
          name: 'Input voltage'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.3.3.1.0]'
          key: 'input.voltage[upsHighPrecInputLineVoltage]'
          value_type: FLOAT
          units: V
          description: |
            MIB: PowerNet-MIB
            The current utility line voltage in VAC.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
          triggers:
            - uuid: 68ca3f249e454291887babd1ad7aa858
              expression: 'min(/xAPC UPS/input.voltage[upsHighPrecInputLineVoltage],{$TIME.PERIOD}) > 0 and (min(/xAPC UPS/input.voltage[upsHighPrecInputLineVoltage],{$TIME.PERIOD}) > {$UPS.INPUT_VOLT.MAX.WARN} or max(/xAPC UPS/input.voltage[upsHighPrecInputLineVoltage],{$TIME.PERIOD}) < {$UPS.INPUT_VOLT.MIN.WARN})'
              name: 'APC UPS: Unacceptable Input Voltage'
              event_name: 'APC UPS: Unacceptable input voltage (out of range {$UPS.INPUT_VOLT.MIN.WARN}-{$UPS.INPUT_VOLT.MAX.WARN}V for {$TIME.PERIOD})'
              opdata: 'Current voltage: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: a01671d67cfd4ebf915f0b8d1b31e269
          name: 'Output current'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.4.3.4.0]'
          key: 'output.current[upsHighPrecOutputCurrent]'
          value_type: FLOAT
          units: A
          description: |
            MIB: PowerNet-MIB
            The current in amperes drawn by the load on the UPS.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
        - uuid: 20c3a04e6f3b48ef84f48eccd5b9e3dc
          name: 'Output load'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.4.3.3.0]'
          key: 'output.load[upsHighPrecOutputLoad]'
          value_type: FLOAT
          units: '%'
          description: |
            MIB: PowerNet-MIB
            The current UPS load expressed as percentage
            of rated capacity.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
          triggers:
            - uuid: 5311c7243ddb475c8b1f9ce64ede23ad
              expression: 'min(/xAPC UPS/output.load[upsHighPrecOutputLoad],{$TIME.PERIOD}) > {$UPS.OUTPUT.MAX.WARN}'
              name: 'APC UPS: Output Load is High'
              event_name: 'APC UPS: Output load is high (over {$UPS.OUTPUT.MAX.WARN}% for {$TIME.PERIOD})'
              opdata: 'Current load: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'A battery installed has an internal error condition.'
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: 8734592e55b94cd3b87eabe54590a3e3
          name: 'Output status'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.4.1.1.0]'
          key: 'output.status[upsBasicOutputStatus]'
          description: |
            MIB: PowerNet-MIB
            The current state of the UPS. If the UPS is unable to
             determine the state of the UPS this variable is set
             to unknown(1).
            During self-test most UPSes report onBattery(3) but
             some that support it will report onBatteryTest(15).
             To determine self-test status across all UPSes, refer
             to the upsBasicStateOutputState OID.
          valuemap:
            name: 'PowerNet-MIB::upsBasicOutputStatus'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: health
            - tag: component
              value: power
          triggers:
            - uuid: de396fcb62cd461996f2858a4a6e59e3
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=16'
              name: 'APC UPS: UPS is Emergency Static Bypass'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: 17a96966f5964eda816b3f6e187a8427
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=10'
              name: 'APC UPS: UPS is Hardware Failure Bypass'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: e367ad8926d94dabb68052842c19d03e
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=7'
              name: 'APC UPS: UPS is Off!'
              priority: HIGH
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: 7b7302c1a8934ace8ddceed8fd588c83
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=3'
              name: 'APC UPS: UPS is on battery!'
              priority: DISASTER
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: 741064780c3c48a7a63ce932f225ff2f
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=4'
              name: 'APC UPS: UPS is on Smart Boost'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: 2c1b51dcfffb4198ac93bbe2d3d0ab8b
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=12'
              name: 'APC UPS: UPS is On Smart Trim'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: 91c7acef01734ae7af8393fce6fea610
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=8'
              name: 'APC UPS: UPS is Rebooting'
              priority: HIGH
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: e7790d30a125457f8c387720439c9fe8
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=11'
              name: 'APC UPS: UPS is Sleeping Until Power Return'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: 0845185e8df54bc3befb0cd75ea3b9fa
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=6'
              name: 'APC UPS: UPS is Software Bypass'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: c3d41ab4f1354186b2cd01492445426f
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=9'
              name: 'APC UPS: UPS is Switched Bypass'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: a1a7b1cfe91243708babdc64a12d518a
              expression: 'last(/xAPC UPS/output.status[upsBasicOutputStatus])=5'
              name: 'APC UPS: UPS is Timed Sleeping'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: 07320f0fdee7469ab5b4ba8a32737faa
          name: 'Output voltage'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.4.3.1.0]'
          key: 'output.voltage[upsHighPrecOutputVoltage]'
          value_type: FLOAT
          units: V
          description: |
            MIB: PowerNet-MIB
            The output voltage of the UPS system in VAC.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: power
        - uuid: ee843285f0fd40b9a65e543802a86802
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: 'system.descr[sysDescr.0]'
          delay: 1d
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            A textual description of the entity. This value should
            include the full name and version identification of the system's hardware type, software operating-system, and
            networking software.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 32fe5a9e7b8245f8897b979dfc45d377
          name: 'Uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.1.0]'
          key: 'system.hw.uptime[hrSystemUptime.0]'
          delay: 5m
          trends: '0'
          units: uptime
          description: |
            MIB: HOST-RESOURCES-MIB
            The amount of time since this host was last initialized. Note that this is different from sysUpTime in the SNMPv2-MIB [RFC1907] because sysUpTime is the uptime of the network management portion of the system.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 6bb8178804474facb944174525f896d0
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: 'system.location[sysLocation.0]'
          delay: 1d
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The physical location of this node (e.g., `telephone closet, 3rd floor').  If the location is unknown, the value is the zero-length string.
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: 2c8bb14bd48a49b0bc015af1c990a4f6
          name: Model
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.1.1.1.0]'
          key: 'system.model[upsBasicIdentModel]'
          delay: 1d
          value_type: CHAR
          description: |
            MIB: PowerNet-MIB
            The UPS model name (e.g. 'APC Smart-UPS 600').
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: inventory
        - uuid: d0f510d74bbd4c32851d778aa4cb005f
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: 'system.name[sysName.0]'
          delay: 1d
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name.  If the name is unknown, the value is the zero-length string.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 69dc3a8a05854e739a830984d0e443b4
              expression: 'last(/xAPC UPS/system.name[sysName.0],#1)<>last(/xAPC UPS/system.name[sysName.0],#2) and length(last(/xAPC UPS/system.name[sysName.0]))>0'
              name: 'APC UPS: System name has changed'
              event_name: 'APC UPS: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'APC UPS: No SNMP Data Collection'
                  expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 943ba7344c0949f4965562b8c87aaada
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 5m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            The time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 073390780ade4c118c0c70445ed42821
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.2.0]'
          key: 'system.objectid[sysObjectID.0]'
          delay: 1d
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The vendor's authoritative identification of the network management subsystem contained in the entity.  This value is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what kind of box' is being managed.  For example, if vendor`Flintstones, Inc.' was assigned the subtree1.3.6.1.4.1.4242, it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router'.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: af0f654b240a49b5ac62b39eb058a69d
          name: 'Serial number'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.1.2.3.0]'
          key: 'system.sn[upsAdvIdentSerialNumber]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: PowerNet-MIB
            An 8-character string identifying the serial number of
             the UPS internal microprocessor.  This number is set at
             the factory.  NOTE: This number does NOT correspond to
             the serial number on the rear of the UPS.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: inventory
        - uuid: f47e2ee44b5b41a6bbbc6865f4532f74
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 998c83229de94523b1dfce0f71bcb2a8
              expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'APC UPS: No SNMP Data Collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              manual_close: 'YES'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: e7ed0796921343ff8c0666357fb7655e
          name: 'External bad battery packs discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#EXTERNAL_PACKS},1.3.6.1.4.1.318.1.1.1.2.2.6]'
          key: battery.packs.bad.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#EXTERNAL_PACKS}'
                value: '-1'
                operator: NOT_MATCHES_REGEX
          description: 'Discovery of the number of external defective battery packs.'
          item_prototypes:
            - uuid: ee29ebc5b0b248fc9b0abfef11aa6afa
              name: '{#SNMPINDEX}: External battery packs bad'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.2.6.0]'
              key: 'battery.external_packs_bad[upsAdvBatteryNumOfBadBattPacks.{#SNMPINDEX}]'
              delay: 15m
              description: |
                MIB: PowerNet-MIB
                The number of external battery packs connected to the UPS that
                are defective. If the UPS does not use smart cells then the
                agent reports ERROR_NO_SUCH_NAME.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: inventory
        - uuid: 57f0048eb0de425c90dda6429f2b533c
          name: 'External battery packs discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#CARTRIDGE_STATUS},1.3.6.1.4.1.318.1.1.1.2.3.10.2.1.7,{#BATTERY_PACK},1.3.6.1.4.1.318.1.1.1.2.3.10.2.1.1,{#CARTRIDGE_INDEX},1.3.6.1.4.1.318.1.1.1.2.3.10.2.1.2]'
          key: battery.packs.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#CARTRIDGE_STATUS}'
                value: ^$
                operator: NOT_MATCHES_REGEX
          item_prototypes:
            - uuid: f6fcb53eaac9478b90433f7ed5256f76
              name: '{#BATTERY_PACK}.{#CARTRIDGE_INDEX}: Battery estimated replace date'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.3.10.2.1.8.{#SNMPINDEX}]'
              key: 'battery.estimated_replace_date[upsHighPrecBatteryPackCartridgeReplaceDate.{#BATTERY_PACK}.{#CARTRIDGE_INDEX}]'
              delay: 1h
              value_type: CHAR
              description: |
                MIB: PowerNet-MIB
                The battery cartridge estimated battery replace date.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: inventory
                - tag: component
                  value: power
            - uuid: 2c7b37e0a6834cb0b501f943fa2ea4fe
              name: '{#BATTERY_PACK}.{#CARTRIDGE_INDEX}: Battery pack cartridge health'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.3.10.2.1.7.{#SNMPINDEX}]'
              key: 'battery.pack.cartridge_health[upsHighPrecBatteryPackCartridgeHealth.{#BATTERY_PACK}.{#CARTRIDGE_INDEX}]'
              delay: 5m
              value_type: CHAR
              description: |
                MIB: PowerNet-MIB
                The battery cartridge health.
                  bit 0 Battery lifetime okay
                  bit 1 Battery lifetime near end, order replacement cartridge
                  bit 2 Battery lifetime exceeded, replace battery
                  bit 3 Battery lifetime near end acknowledged, order replacement cartridge
                  bit 4 Battery lifetime exceeded acknowledged, replace battery
                  bit 5 Battery measured lifetime near end, order replacement cartridge
                  bit 6 Battery measured lifetime near end acknowledged, order replacement cartridge
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: health
                - tag: component
                  value: power
              trigger_prototypes:
                - uuid: 781bed94779a42f2843fe488e0049d6a
                  expression: 'find(/xAPC UPS/battery.pack.cartridge_health[upsHighPrecBatteryPackCartridgeHealth.{#BATTERY_PACK}.{#CARTRIDGE_INDEX}],,"regexp","^(0)[0|1]{15}$")=1'
                  name: 'APC UPS: {#BATTERY_PACK}.{#CARTRIDGE_INDEX}: Battery lifetime is not okay'
                  opdata: 'Current bit set: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    The battery cartridge health.
                      bit 0 Battery lifetime okay
                      bit 1 Battery lifetime near end, order replacement cartridge
                      bit 2 Battery lifetime exceeded, replace battery
                      bit 3 Battery lifetime near end acknowledged, order replacement cartridge
                      bit 4 Battery lifetime exceeded acknowledged, replace battery
                      bit 5 Battery measured lifetime near end, order replacement cartridge
                      bit 6 Battery measured lifetime near end acknowledged, order replacement cartridge
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 3d9af5fb67dc4431a1a9f59e791c6995
              name: '{#BATTERY_PACK}.{#CARTRIDGE_INDEX}: Battery status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.3.10.2.1.10.{#SNMPINDEX}]'
              key: 'battery.pack.status[upsHighPrecBatteryPackCartridgeStatus.{#BATTERY_PACK}.{#CARTRIDGE_INDEX}]'
              delay: 5m
              value_type: CHAR
              description: |
                MIB: PowerNet-MIB
                The status of the UPS batteries. A batteryLow(3) value
                 indicates the UPS will be unable to sustain the current
                 load, and its services will be lost if power is not restored.
                 The amount of run time in reserve at the time of low battery
                 can be configured by the upsAdvConfigLowBatteryRunTime.
                 A batteryInFaultCondition(4)value indicates that a battery
                 installed has an internal error condition.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: health
                - tag: component
                  value: power
              trigger_prototypes:
                - uuid: f667e6cf482a42759a7848dccd3e76dc
                  expression: 'find(/xAPC UPS/battery.pack.status[upsHighPrecBatteryPackCartridgeStatus.{#BATTERY_PACK}.{#CARTRIDGE_INDEX}],,"regexp","^(0{16})$")=0'
                  name: 'APC UPS: {#BATTERY_PACK}.{#CARTRIDGE_INDEX}: Battery status is not okay'
                  opdata: 'Current bit set: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    The battery cartridge status:
                    bit 0 Disconnected
                    bit 1 Overvoltage
                    bit 2 NeedsReplacement
                    bit 3 OvertemperatureCritical
                    bit 4 Charger
                    bit 5 TemperatureSensor
                    bit 6 BusSoftStart
                    bit 7 OvertemperatureWarning
                    bit 8 GeneralError
                    bit 9 Communication
                    bit 10 DisconnectedFrame
                    bit 11 FirmwareMismatch
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 47860d3cf64441a4ab6676ae44ac385d
              name: '{#BATTERY_PACK}.{#CARTRIDGE_INDEX}: Battery temperature'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.3.10.2.1.5.{#SNMPINDEX}]'
              key: 'battery.temperature[upsHighPrecBatteryPackTemperature.{#BATTERY_PACK}.{#CARTRIDGE_INDEX}]'
              delay: 5m
              value_type: FLOAT
              units: ℃
              description: |
                MIB: PowerNet-MIB
                The current internal UPS temperature in Celsius.
                Temperatures below zero read as 0.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.1'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: temperature
              trigger_prototypes:
                - uuid: 6cc51d84f3084389a2585c0ff88868bd
                  expression: 'min(/xAPC UPS/battery.temperature[upsHighPrecBatteryPackTemperature.{#BATTERY_PACK}.{#CARTRIDGE_INDEX}],{$TIME.PERIOD}) > {$BATTERY.TEMP.MAX.WARN}'
                  name: 'APC UPS: {#BATTERY_PACK}.{#CARTRIDGE_INDEX}: Battery has high temperature'
                  event_name: 'APC UPS Symmetra: {#BATTERY_PACK}.{#CARTRIDGE_INDEX}: Battery has high temperature (over {$BATTERY.TEMP.MAX.WARN}℃ for {$TIME.PERIOD})'
                  opdata: 'Current temperature: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 389ad87dcedc44afb625a2ae82ae4b59
              name: '{#BATTERY_PACK}.{#CARTRIDGE_INDEX}: Serial number'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.2.3.10.2.1.4.{#SNMPINDEX}]'
              key: 'system.sn[upsHighPrecBatteryPackSerialNumber.{#BATTERY_PACK}.{#CARTRIDGE_INDEX}]'
              delay: 15m
              value_type: CHAR
              description: |
                MIB: PowerNet-MIB
                An 8-character string identifying the serial number of
                 the UPS internal microprocessor.  This number is set at
                 the factory.  NOTE: This number does NOT correspond to
                 the serial number on the rear of the UPS.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: inventory
        - uuid: 523aed2a65e94f159ac9b73655c644fb
          name: 'External sensor port 1 discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#EXTERNAL_SENSOR1_NAME},1.3.6.1.4.1.318.1.1.25.1.2.1.3]'
          key: external.sensor1.discovery
          delay: 1h
          description: uioSensorStatusTable
          item_prototypes:
            - uuid: 4451550ea8774c78b87cb3363e1202d3
              name: '{#EXTERNAL_SENSOR1_NAME}: Humidity sensor'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.25.1.2.1.7.{#SNMPINDEX}]'
              key: 'external.sensor.humidity[uioSensorStatusHumidity.1.{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: '%'
              description: |
                MIB: PowerNet-MIB
                The sensor's current humidity reading - a relative humidity
                 percentage. -1 indicates an invalid reading due to either a
                 sensor that doesn't read humidity or lost communications.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: humidity
                - tag: component
                  value: power
            - uuid: def0095a4e734fc3b5b3938ac59a6766
              name: '{#EXTERNAL_SENSOR1_NAME}: Sensor alarm status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.25.1.2.1.9.{#SNMPINDEX}]'
              key: 'external.sensor.status[uioSensorStatusAlarmStatus.1.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: PowerNet-MIB
                The alarm status of the sensor. Possible values:
                uioNormal                 (1),
                uioWarning                (2),
                uioCritical               (3),
                sensorStatusNotApplicable (4)
              valuemap:
                name: 'PowerNet-MIB::uioSensorStatusAlarmStatus'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: health
                - tag: component
                  value: power
              trigger_prototypes:
                - uuid: 23b9af0088ec4b2c8033bebd1871cf40
                  expression: 'last(/xAPC UPS/external.sensor.status[uioSensorStatusAlarmStatus.1.{#SNMPINDEX}])=3'
                  name: 'APC UPS: {#EXTERNAL_SENSOR1_NAME}: Sensor has status Critical'
                  priority: HIGH
                  description: 'The external sensor has returned a value greater than the critical threshold.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 84c9647b6df646e4ad8a9e69d64d4b1e
                  expression: 'last(/xAPC UPS/external.sensor.status[uioSensorStatusAlarmStatus.1.{#SNMPINDEX}])=4'
                  name: 'APC UPS: {#EXTERNAL_SENSOR1_NAME}: Sensor has status Not Applicable'
                  priority: INFO
                  description: 'The external sensor does not work or is not connected.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: c7a8058daf0a4750ba1f90f2bdd29368
                  expression: 'last(/xAPC UPS/external.sensor.status[uioSensorStatusAlarmStatus.1.{#SNMPINDEX}])=2'
                  name: 'APC UPS: {#EXTERNAL_SENSOR1_NAME}: Sensor has status Warning'
                  priority: AVERAGE
                  description: 'The external sensor has returned a value greater than the warning threshold.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 17fe9529104c452589b8716b034e0683
              name: '{#EXTERNAL_SENSOR1_NAME}: Temperature sensor'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.25.1.2.1.6.{#SNMPINDEX}]'
              key: 'external.sensor.temperature[uioSensorStatusTemperatureDegC.1.{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: °F
              description: |
                MIB: PowerNet-MIB
                The sensor's current temperature reading in Celsius.
                 -1 indicates an invalid reading due to lost communications.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'return (value * 1.8) + 32;'
              tags:
                - tag: component
                  value: power
                - tag: component
                  value: temperature
          overrides:
            - name: Temp
              step: '1'
              filter:
                conditions:
                  - macro: '{#EXTERNAL_SENSOR1_NAME}'
                    value: Temp
              operations:
                - operator: LIKE
                  value: Humidity
                  discover: NO_DISCOVER
        - uuid: 6f33fb3c0f73499988d474701622cf7e
          name: 'External sensor port 2 discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#EXTERNAL_SENSOR2_NAME},1.3.6.1.4.1.318.1.1.25.1.2.2.3]'
          key: external.sensor2.discovery
          delay: 1h
          description: uioSensorStatusTable
          item_prototypes:
            - uuid: f22af53b037544faab8853b8a5281f96
              name: '{#EXTERNAL_SENSOR2_NAME}: Humidity sensor'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.25.1.2.2.7.{#SNMPINDEX}]'
              key: 'external.sensor.humidity[uioSensorStatusHumidity.2.{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: '%'
              description: |
                MIB: PowerNet-MIB
                The sensor's current humidity reading - a relative humidity
                 percentage. -1 indicates an invalid reading due to either a
                 sensor that doesn't read humidity or lost communications.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: humidity
                - tag: component
                  value: power
            - uuid: 2f35fe29d48d48ec8e1c90f338428b92
              name: '{#EXTERNAL_SENSOR2_NAME}: Sensor alarm status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.25.1.2.2.9.{#SNMPINDEX}]'
              key: 'external.sensor.status[uioSensorStatusAlarmStatus.2.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: PowerNet-MIB
                The alarm status of the sensor. Possible values:
                uioNormal                 (1),
                uioWarning                (2),
                uioCritical               (3),
                sensorStatusNotApplicable (4)
              valuemap:
                name: 'PowerNet-MIB::uioSensorStatusAlarmStatus'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: health
                - tag: component
                  value: power
              trigger_prototypes:
                - uuid: a49ffe82bcd64358ac3831563024b018
                  expression: 'last(/xAPC UPS/external.sensor.status[uioSensorStatusAlarmStatus.2.{#SNMPINDEX}])=3'
                  name: 'APC UPS: {#EXTERNAL_SENSOR2_NAME}: Sensor has status Critical'
                  priority: HIGH
                  description: 'The external sensor has returned a value greater than the critical threshold.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 092cdd8e2a224cf7825e6cec62af873f
                  expression: 'last(/xAPC UPS/external.sensor.status[uioSensorStatusAlarmStatus.2.{#SNMPINDEX}])=4'
                  name: 'APC UPS: {#EXTERNAL_SENSOR2_NAME}: Sensor has status Not Applicable'
                  priority: INFO
                  description: 'The external sensor does not work or is not connected.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: b386523a1e1b49ed92ea0a8fe85b76fb
                  expression: 'last(/xAPC UPS/external.sensor.status[uioSensorStatusAlarmStatus.2.{#SNMPINDEX}])=2'
                  name: 'APC UPS: {#EXTERNAL_SENSOR2_NAME}: Sensor has status Warning'
                  priority: AVERAGE
                  description: 'The external sensor has returned a value greater than the warning threshold.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 9f5d8dfec67b46eeabded714cfa9c472
              name: '{#EXTERNAL_SENSOR2_NAME}: Temperature sensor'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.25.1.2.2.6.{#SNMPINDEX}]'
              key: 'external.sensor.temperature[uioSensorStatusTemperatureDegC.2.{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: ℃
              description: |
                MIB: PowerNet-MIB
                The sensor's current temperature reading in Celsius.
                 -1 indicates an invalid reading due to lost communications.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: power
                - tag: component
                  value: temperature
          overrides:
            - name: Temp
              step: '1'
              filter:
                conditions:
                  - macro: '{#EXTERNAL_SENSOR2_NAME}'
                    value: Temp
              operations:
                - operator: LIKE
                  value: Humidity
                  discover: NO_DISCOVER
        - uuid: dce7515a0ac2479b909e35c9951a5690
          name: 'Input phases discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PHASEINDEX},1.3.6.1.4.1.318.1.1.1.9.2.3.1.2.1.1]'
          key: input.phases.discovery
          delay: 1h
          description: 'The input phase identifier. OID upsPhaseInputPhaseIndex.1.1'
          item_prototypes:
            - uuid: 55b9f12b157a4e6db8778d9c3094b42c
              name: '{#PHASEINDEX}: Phase input current'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.9.2.3.1.6.1.1.{#PHASEINDEX}]'
              key: 'phase.input.current[upsPhaseInputCurrent.1.1.{#PHASEINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: A
              description: |
                MIB: PowerNet-MIB
                The input current in 0.1 amperes, or -0.1 if it's
                 unsupported by this UPS.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.1'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: power
            - uuid: 718271463fcd4118b74d020c6f773d7b
              name: '{#PHASEINDEX}: Phase input voltage'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.318.1.1.1.9.2.3.1.3.1.1.{#PHASEINDEX}]'
              key: 'phase.input.voltage[upsPhaseInputVoltage.1.1.{#PHASEINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: V
              description: |
                MIB: PowerNet-MIB
                The input voltage in VAC, or -1 if it's unsupported
                 by this UPS.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
