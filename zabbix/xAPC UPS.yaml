              trigger_prototypes:
                - uuid: 154cf25c308a422687556423f50d9a30
                  expression: 'min(/xAPC UPS/phase.input.voltage[upsPhaseInputVoltage.1.1.{#PHASEINDEX}],{$TIME.PERIOD}) > {$UPS.INPUT_VOLT.MAX.WARN} or max(/xAPC UPS/phase.input.voltage[upsPhaseInputVoltage.1.1.{#PHASEINDEX}],{$TIME.PERIOD}) < {$UPS.INPUT_VOLT.MIN.WARN}'
                  name: 'APC UPS: {#PHASEINDEX}: Unacceptable phase {#PHASEINDEX} input voltage'
                  event_name: 'APC UPS Symmetra: {#PHASEINDEX}: Unacceptable phase {#PHASEINDEX} input voltage (out of range {$UPS.INPUT_VOLT.MIN.WARN}-{$UPS.INPUT_VOLT.MAX.WARN}V for {$TIME.PERIOD})'
                  opdata: 'Current phase {#PHASEINDEX} voltage: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  manual_close: 'YES'
                  dependencies:
                    - name: 'APC UPS: No SNMP Data Collection'
                      expression: 'max(/xAPC UPS/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: notice
