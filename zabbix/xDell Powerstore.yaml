zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: 4232bb16af74433fae00765cb09a2e16
      template: 'xDell Powerstore'
      name: 'xDell Powerstore'
      groups:
        - name: MT
      items:
        - uuid: 62138a5a5c754f0d8e916eebfac85885
          name: 'PowerStore - Get Appliance (raw JSON)'
          type: HTTP_AGENT
          key: powerstore.appliance.raw
          delay: 30m
          history: 7d
          value_type: TEXT
          authtype: BASIC
          username: API
          password: {API-PASSWORD}
          url: 'https://{HOST.HOST}/api/rest/appliance?select=id,name,service_tag,model,mode,node_count,drive_failure_tolerance_level,storage_class'
          status_codes: ''
          follow_redirects: 'NO'
          output_format: JSON
        - uuid: 4589ddfc1bcc4f079a65c64220594543
          name: 'PowerStore - Get Drives (raw JSON)'
          type: HTTP_AGENT
          key: powerstore.drives.raw
          delay: 30m
          history: 7d
          value_type: TEXT
          authtype: BASIC
          username: API
          password: {API-PASSWORD}
          url: 'https://{HOST.HOST}/api/rest/hardware?select=id,name,type,lifecycle_state&type=eq.Drive'
          status_codes: ''
          follow_redirects: 'NO'
          output_format: JSON
        - uuid: 7c4ac7fe2fe8441f9ed0f252bff58bb4
          name: 'PowerStore - Get Eth Ports (raw JSON)'
          type: HTTP_AGENT
          key: powerstore.eth.raw
          delay: 30m
          history: 7d
          value_type: TEXT
          authtype: BASIC
          username: API
          password: {API-PASSWORD}
          url: 'https://{HOST.HOST}/api/rest/eth_port?select=id,name,appliance_id,mac_address,is_link_up,is_in_use,current_speed,current_mtu'
          status_codes: ''
          follow_redirects: 'NO'
          output_format: JSON
        - uuid: e33dc40b1a6e4aada19e51112984018f
          name: 'PowerStore - Get IO Modules (raw JSON)'
          type: HTTP_AGENT
          key: powerstore.io.raw
          delay: 30m
          history: 7d
          value_type: TEXT
          authtype: BASIC
          username: API
          password: {API-PASSWORD}
          url: 'https://{HOST.HOST}/api/rest/hardware?select=id,name,type,lifecycle_state&type=eq.IO_Module'
          status_codes: ''
          follow_redirects: 'NO'
          output_format: JSON
        - uuid: 305b26e020ee47b4af1a27e6dbb5ba63
          name: 'PowerStore - Get Initiators (raw JSON)'
          type: HTTP_AGENT
          key: powerstore.iscsi.raw
          delay: 30m
          history: 7d
          value_type: TEXT
          authtype: BASIC
          username: API
          password: {API-PASSWORD}
          url: 'https://{HOST.HOST}/api/rest/initiator?select=id,host_id,port_name,port_type,active_sessions,host'
          status_codes: ''
          follow_redirects: 'NO'
          output_format: JSON
        - uuid: 8f7f825a67e2409a8d1a283870528a29
          name: 'PowerStore - Get PSU (raw JSON)'
          type: HTTP_AGENT
          key: powerstore.psu.raw
          delay: 30m
          history: 7d
          value_type: TEXT
          authtype: BASIC
          username: API
          password: {API-PASSWORD}
          url: 'https://{HOST.HOST}/api/rest/hardware?select=id,name,type,lifecycle_state&type=eq.Power_Supply'
          status_codes: ''
          follow_redirects: 'NO'
          output_format: JSON
        - uuid: 2f725277ab674301b2caecd0fcf29c57
          name: 'PowerStore - Get Volumes (raw JSON)'
          type: HTTP_AGENT
          key: powerstore.volumes.raw
          delay: 30m
          history: 7d
          value_type: TEXT
          authtype: BASIC
          username: API
          password: {API-PASSWORD}
          url: 'https://{HOST.HOST}/api/rest/volume?select=id,name,type,state,size,logical_used,&type=eq.Primary'
          status_codes: ''
          follow_redirects: 'NO'
          output_format: JSON
      discovery_rules:
        - uuid: 3ba741dbae4a4c418ec8c6609023f8c0
          name: 'Discover PowerStore Appliance'
          type: DEPENDENT
          key: powerstore.appliance
          item_prototypes:
            - uuid: d09aca7b279d4c058ec6739c1608b2cc
              name: 'Drive Failure Tolerance Level'
              type: DEPENDENT
              key: 'powerstore.appliance.hddfailurelvl[{#NAME}]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.body[?(@.name=="{#NAME}")].drive_failure_tolerance_level'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      const a = JSON.parse(value);
                      return Array.isArray(a) ? a[0] : value;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: powerstore.appliance.raw
              tags:
                - tag: PowerStore
                  value: Appliance
            - uuid: 26f392a37d314c11b00936cd6ad2396e
              name: Model
              type: DEPENDENT
              key: 'powerstore.appliance.model[{#NAME}]'
              value_type: TEXT
