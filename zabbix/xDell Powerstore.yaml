                - type: JAVASCRIPT
                  parameters:
                    - |
                      const a = JSON.parse(value);
                      return Array.isArray(a) ? a[0] : value;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: powerstore.appliance.raw
              tags:
                - tag: PowerStore
                  value: Appliance
            - uuid: b65d5948a50b4e6a9708ac9019dbc53d
              name: 'Storage Mode'
              type: DEPENDENT
              key: 'powerstore.appliance.mode[{#NAME}]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.body[?(@.name=="{#NAME}")].mode'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      const a = JSON.parse(value);
                      return Array.isArray(a) ? a[0] : value;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: powerstore.appliance.raw
              tags:
                - tag: PowerStore
                  value: Appliance
            - uuid: 442da04f42ab44978e9b23c90a3082a7
              name: 'Service Tag'
              type: DEPENDENT
              key: 'powerstore.appliance.service_tag[{#NAME}]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
