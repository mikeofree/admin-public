                - type: JAVASCRIPT
                  parameters:
                    - |
                      const a = JSON.parse(value);
                      return Array.isArray(a) ? a[0] : value;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: powerstore.appliance.raw
              tags:
                - tag: PowerStore
                  value: Appliance
            - uuid: 6d6fa29b127b4214816b1429b28a2155
              name: 'Storage Class'
              type: DEPENDENT
              key: 'powerstore.appliance.storage_class[{#NAME}]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.body[?(@.name=="{#NAME}")].storage_class'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      const a = JSON.parse(value);
                      return Array.isArray(a) ? a[0] : value;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: powerstore.appliance.raw
              tags:
                - tag: PowerStore
                  value: Appliance
          master_item:
            key: powerstore.appliance.raw
          lld_macro_paths:
            - lld_macro: '{#DRIVE_FAILURE_TOLERANCE_LEVEL}'
              path: $.drive_failure_tolerance_level
            - lld_macro: '{#ID}'
