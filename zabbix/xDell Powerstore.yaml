            - lld_macro: '{#NODE_COUNT}'
              path: $.node_count
            - lld_macro: '{#SERVICE_TAG}'
              path: $.service_tag
            - lld_macro: '{#STORAGE_CLASS}'
              path: $.storage_class
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.body[*]'
        - uuid: 5d145622172d4d688ba70d38f7be6016
          name: 'Discover PowerStore Drives'
          type: DEPENDENT
          key: powerstore.drives
          item_prototypes:
            - uuid: 5fd3a4c8d5be40c29634a32a48e119e3
              name: 'HDD [{#NAME}]: Status'
              type: DEPENDENT
              key: 'powerstore.drive.state[{#NAME}]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.body[?(@.name=="{#NAME}")].lifecycle_state'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      const a = JSON.parse(value);
                      return Array.isArray(a) ? a[0] : value;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: powerstore.drives.raw
              tags:
                - tag: PowerStore
                  value: 'Drive Health'
              trigger_prototypes:
                - uuid: c843d97875e64ef4bf54af59c119ecf7
                  expression: |
                    last(/xDell Powerstore/powerstore.drive.state[{#NAME}])="Failed"
                    or
                    last(/xDell Powerstore/powerstore.drive.state[{#NAME}])="Prepare_Failed"
                  name: 'Drive {#NAME} has FAILED!'
                  opdata: '(state={ITEM.LASTVALUE})'
                  priority: DISASTER
                  type: MULTIPLE
                  manual_close: 'YES'
                  dependencies:
                    - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                      expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
                  tags:
                    - tag: Component
                      value: Drive
                - uuid: d36a11c2bc2a4f279b0eae72130ddb77
                  expression: |
                    last(/xDell Powerstore/powerstore.drive.state[{#NAME}])="Uninitialized"
                    or
                    last(/xDell Powerstore/powerstore.drive.state[{#NAME}])="Initializing"
                    or
                    last(/xDell Powerstore/powerstore.drive.state[{#NAME}])="Prepare_Reset"
                    or
                    last(/xDell Powerstore/powerstore.drive.state[{#NAME}])="Trigger_Update"
                  name: 'Drive {#NAME} is in Startup/Transient mode!'
                  opdata: '(state={ITEM.LASTVALUE})'
                  priority: WARNING
                  type: MULTIPLE
                  manual_close: 'YES'
                  dependencies:
                    - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                      expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
                  tags:
                    - tag: Component
                      value: Drive
                - uuid: 83148b7edcd64b75b736262704c5d29e
                  expression: |
                    last(/xDell Powerstore/powerstore.drive.state[{#NAME}])<>"Healthy"
                    and
                    last(/xDell Powerstore/powerstore.drive.state[{#NAME}])="Replaced"
                    or
                    last(/xDell Powerstore/powerstore.drive.state[{#NAME}])="Disconnected"
                  name: 'Drive {#NAME} removed/missing/error!'
                  opdata: '(state={ITEM.LASTVALUE})'
                  priority: WARNING
                  type: MULTIPLE
                  manual_close: 'YES'
                  dependencies:
                    - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                      expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
                  tags:
                    - tag: Component
                      value: Drive
          master_item:
            key: powerstore.drives.raw
          lld_macro_paths:
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#NAME}'
              path: $.name
            - lld_macro: '{#STATE}'
              path: $.lifecycle_state
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.body[*]'
