              master_item:
                key: powerstore.eth.raw
              tags:
                - tag: PowerStore
                  value: Eth
            - uuid: bf40922742e24ae28a16a7c0da7a3d79
              name: 'Link ({#NAME}) UP STATUS'
              type: DEPENDENT
              key: 'powerstore.eth.link_status[{#NAME}]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.body[?(@.name=="{#NAME}")].is_link_up'
                - type: JAVASCRIPT
                  parameters:
