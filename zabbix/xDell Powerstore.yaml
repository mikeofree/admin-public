              master_item:
                key: powerstore.eth.raw
              tags:
                - tag: PowerStore
                  value: Eth
            - uuid: 87e9ec1f504640bb9a73aba6a854abf5
              name: 'FE PORT [{#NAME}] Bytes Recieved'
              type: HTTP_AGENT
              key: 'powerstore.eth.recieved[{#NAME}]'
              delay: 10m
              trends: '0'
              units: Bytes
              authtype: BASIC
              username: API
              password: {API-PASSWORD}
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.body[?(@.fe_port_id=="{#ID}")].bytes_rx_ps'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var arr = JSON.parse(value);          // value is a JSON array
                      var sum = 0;
                      var count = 0;
                      for (var i = 0; i < arr.length; i++) {
                        var n = parseFloat(arr[i]);
                        if (isFinite(n)) {
                          sum += n;
                          count++;
                        }
                      }
                      if (count === 0) { return 0; }
                      return sum / count;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              url: 'https://{HOST.HOST}/api/rest/metrics/generate'
              follow_redirects: 'NO'
              post_type: JSON
              posts: |
                {
                  "entity": "performance_metrics_by_fe_eth_port",
                  "entity_id": "{#ID}",
                  "interval": "Best_Available"
                }
              request_method: POST
              output_format: JSON
              tags:
                - tag: PowerStore
                  value: 'Eth TX'
            - uuid: c6a9210f8eeb4fc8a60c600a5de2613e
              name: 'FE PORT [{#NAME}] RX CRC Errors'
              type: HTTP_AGENT
              key: 'powerstore.eth.rx_crc[{#NAME}]'
              delay: 10m
              trends: '0'
              authtype: BASIC
              username: API
              password: {API-PASSWORD}
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.body[?(@.fe_port_id=="{#ID}")].pkt_rx_crc_error_ps'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var arr = JSON.parse(value);
                      // If the filter returned [[...]], flatten once; if it returned a scalar, box it
                      if (Array.isArray(arr) && Array.isArray(arr[0])) arr = arr[0];
                      if (!Array.isArray(arr)) arr = [arr];
                      // Find the max, ignoring non-numeric values
                      var max = null;
                      for (var i = 0; i < arr.length; i++) {
                        var n = parseFloat(arr[i]);
                        if (isFinite(n)) {
                          if (max === null || n > max) max = n;
                        }
                      }
                      return max === null ? 0 : max;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              url: 'https://{HOST.HOST}/api/rest/metrics/generate'
              follow_redirects: 'NO'
              post_type: JSON
              posts: |
                {
                  "entity": "performance_metrics_by_fe_eth_port",
                  "entity_id": "{#ID}",
                  "interval": "Best_Available"
                }
              request_method: POST
              output_format: JSON
              tags:
