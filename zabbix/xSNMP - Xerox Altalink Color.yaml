zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: d33bac2bc1274db098bbeefc9785cc36
      template: 'xSNMP - Xerox Altalink Color'
      name: 'xSNMP - Xerox Altalink Color'
      description: |
        Works with: 
        
        
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: 940e59edf639487ab80dce3537d059e4
          name: 'Toner Black'
          type: CALCULATED
          key: ink.black.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.black.now)/last(//ink.black.max)'
        - uuid: e7c05a0fa1cc41f68635c9242f9d1833
          name: 'Max Toner Black'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ink.black.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 8c748cd8346648f4874b7e3c4d3b2e7b
          name: 'Current Toner Black Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ink.black.now
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 568a4ce962b3410dbf901202b1453f0f
          name: 'Toner Cyan'
          type: CALCULATED
          key: ink.cyan.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.cyan.now)/last(//ink.cyan.max)'
        - uuid: 39ac793e37484ec79cf825ebe724ca84
          name: 'Max Toner Cyan'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.2
          key: ink.cyan.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 91bb77dccbf54ba3a47f0ae09e1d22b4
          name: 'Current Toner Cyan Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.2
          key: ink.cyan.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: d3aea71c44f34e598b1811c10e8b806b
          name: 'Toner Magenta'
          type: CALCULATED
          key: ink.magenta.calcualted
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.magenta.now)/last(//ink.magenta.max)'
        - uuid: ccfb31ecb8fc4ccf96794dd57437fd44
          name: 'Max Toner Magenta'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.3
          key: ink.magenta.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 6d5d73bdbb56434a804468e41ff8c2b3
          name: 'Current Toner Magenta Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.3
          key: ink.magenta.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: a535d7146f7f43318ea8085026ac3226
          name: 'Toner Yellow'
          type: CALCULATED
          key: ink.yellow.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.yellow.now)/last(//ink.yellow.max)'
        - uuid: e36ad1f35c7c4037a9fce0e7cc38d2a8
          name: 'Max Toner Yellow'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.4
          key: ink.yellow.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: b8fdffbfa602469aae94962d95118fcb
          name: 'Current Toner Yellow Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.4
          key: ink.yellow.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: d6d4faa16d93481a974f1e31ef27e53c
          name: 'Printer IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.4.20.1.1.10.20.7.184
          key: printer.ip
          delay: 1h
          value_type: CHAR
        - uuid: 9be10580b9124ad9a8b6f96c2a07fb8c
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1347.43.5.1.1.1.1
          key: printer.model
          delay: 1d
          value_type: CHAR
        - uuid: e716f3a740b4433f9b507c3cf4d87d31
          name: 'Printer Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
          key: printer.name
          delay: 1d
          value_type: CHAR
        - uuid: 5e38a0a3b120408e9dcbf97c25e71b42
          name: 'Printer Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.16.5.1.2.1.2
          key: printer.status
          value_type: CHAR
        - uuid: 6439c9bced514051ad879ef972da106c
          name: 'Printer Toner Type'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.6.1.1
          key: printer.toner
          delay: 4h
          value_type: CHAR
        - uuid: 13f9eb8c05ee4f58b53991a495ae8980
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 30s
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 6f1f4afa1b154dc2a17a199d72094e43
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 9218663c0dd24f2b835f516790a7d314
              expression: 'max(/xSNMP - Xerox Altalink Color/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: Printer
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: cffedb119907478bb025d202d752a19b
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: cc846e3a02df4fa18958759bed3ee67e
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
