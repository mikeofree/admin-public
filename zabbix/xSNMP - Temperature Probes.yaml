zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: 1316e68d596741f7918d496f03702c5c
      template: 'xSNMP - Temperature Probes'
      name: 'xSNMP - Temperature Probes'
      description: |
        Template for Vertiv Watchdog Temp Probe        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: d2aa84dae4c44ba68aab30d626610696
          name: 'Dew Point'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.21239.5.1.2.1.7.1
          key: snmp.dew
          delay: 5m
          value_type: FLOAT
          trends: 90d
          units: °F
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
        - uuid: 94c075acbd3d4b50b22833e860b23507
          name: Humidity
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.21239.5.1.2.1.6.1
          key: snmp.humidity
          delay: 5m
          value_type: FLOAT
          trends: 90d
          units: '%'
        - uuid: 6d13e15c6e6d4d2da58f6be6df6484e4
          name: Temperature
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.21239.5.1.2.1.5.1
          key: snmp.temp
          delay: 5m
          value_type: FLOAT
          trends: 90d
          units: °F
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
        - uuid: b2ae0912f3d74c70980df4043cc57738
          name: 'Uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.1.0]'
          key: 'system.hw.uptime[hrSystemUptime.0]'
          delay: 10m
          trends: '0'
          units: uptime
          description: |
            MIB: HOST-RESOURCES-MIB
            The amount of time since this host was last initialized. Note that this is different from sysUpTime in the SNMPv2-MIB [RFC1907] because sysUpTime is the uptime of the network management portion of the system.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: cf68b1ca37c343fcb738e6fb9018e097
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.name
          delay: 1d
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name. If the name is unknown, the value is the zero-length string.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 1a802470bbad459398f23996d853ab01
              expression: 'last(/xSNMP - Temperature Probes/system.name,#1)<>last(/xSNMP - Temperature Probes/system.name,#2) and length(last(/xSNMP - Temperature Probes/system.name))>0'
              name: 'SNMP: System name has changed'
              event_name: 'Generic by SNMP: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: b5550e721b004244bfc83dc03c2de37a
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 10m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 4bc84d40823d493eb8a2160872f6f7ad
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 24faaf3ab7b44550beed1a1c5a4f532a
              expression: 'max(/xSNMP - Temperature Probes/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Generic by SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: 'Temp Probe'
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: 15261c0d2ede4feeaf545f82e5cd331e
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: e1a352f55a5e4d61bc50110dcfd8b429
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
  triggers:
    - uuid: f6adaa59cbdc4bca82e9f11f64ae8cef
      expression: '(last(/xSNMP - Temperature Probes/system.hw.uptime[hrSystemUptime.0])>0 and last(/xSNMP - Temperature Probes/system.hw.uptime[hrSystemUptime.0])<10m) or (last(/xSNMP - Temperature Probes/system.hw.uptime[hrSystemUptime.0])=0 and last(/xSNMP - Temperature Probes/system.net.uptime[sysUpTime.0])<10m)'
      name: 'SNMP: Host has been restarted!'
      event_name: 'Generic by SNMP: {HOST.NAME} has been restarted (uptime < 10m)'
      priority: HIGH
      description: 'Uptime is less than 10 minutes.'
      manual_close: 'YES'
      dependencies:
        - name: 'Generic by SNMP: No SNMP data collection'
          expression: 'max(/xSNMP - Temperature Probes/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
      tags:
        - tag: scope
          value: notice
