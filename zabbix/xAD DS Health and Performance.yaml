        - uuid: ccb11bf658ec46b49f8e21d8c7d70862
          name: 'DFS Replicated Folders (Conflict Space In Use)'
          key: 'perf_counter_en[\DFS Replicated Folders(*)\Conflict Space In Use]'
          delay: 10m
          history: 1w
          value_type: FLOAT
          units: Bytes
          description: 'Monitoring the space utilization of the Conflict and Deleted area helps ensure that there is enough space to store replication conflicts and files deleted from replicated folders on the monitored computer. You can view a log of conflict files and their original file names by viewing the ConflictandDeletedManifest.xml file in the DfsrPrivate folder.'
