        - uuid: 9422a131df6d413dbbd41036ed51a0e6
          name: 'Database Cache % Hit'
          key: 'perf_counter_en[\Database(lsass)\Database Cache % Hit]'
          delay: 10m
          history: 1w
          value_type: FLOAT
          units: '%'
          description: 'The "Database Cache % Hit" performance counter for LSASS (Local Security Authority Subsystem Service) indicates the percentage of database queries that are served from the cache, rather than requiring a disk read. A high hit rate (ideally above 90%) signifies efficient database access, while a low hit rate might indicate performance bottlenecks related to disk I/O or insufficient memory allocated for caching.'
          tags:
            - tag: Application
              value: 'AD DS Performance'
          triggers:
            - uuid: cd80f7b81de4450aac5eaa7044625269
              expression: 'min(/xAD DS Health and Performance/perf_counter_en[\Database(lsass)\Database Cache % Hit],20m)<90'
              name: 'Database Cache % Hit < 90 % on {HOST.NAME}'
              status: DISABLED
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: 3db6e037983940d9be2c778c5d4bfade
          name: 'I/O Database Reads/sec'
          key: 'perf_counter_en[\Database ==> Instances(lsass/NTDSA)\I/O Database Reads/sec]'
          delay: 10m
          history: 1w
          value_type: FLOAT
          units: /s
          description: '"I/O Database Reads/sec ntdsa" refers to the rate at which read operations are performed on the Active Directory database (NTDS.dit) on a Windows server. This metric, measured in reads per second, indicates how frequently the server is accessing the Active Directory database to retrieve information. High values can suggest potential performance bottlenecks, especially if the server is experiencing slow response times.'
          tags:
            - tag: Application
              value: 'AD DS Performance'
          triggers:
            - uuid: 71807bb6e6d0416fbaa68fb74833be03
              expression: 'min(/xAD DS Health and Performance/perf_counter_en[\Database ==> Instances(lsass/NTDSA)\I/O Database Reads/sec],5m)>25'
              name: 'I/O Database Reads/sec > 25 on {HOST.NAME}'
              status: DISABLED
              priority: WARNING
              manual_close: 'YES'
        - uuid: 7c33e63e882a48148348477a866a7545
          name: 'I/O Database Reads Average Latency'
          key: 'perf_counter_en[\Database ==> Instances(lsass/NTDSA)\I/O Database Reads Average Latency]'
          delay: 10m
          history: 1w
          value_type: FLOAT
          units: ms
          description: '"I/O Database Reads Average Latency (IODBReadsAvgLatency)" refers to the average time it takes for a database read operation to complete, measured in milliseconds. This metric is crucial for assessing the performance of a database system, as high latency can indicate bottlenecks and slow performance.'
          tags:
            - tag: Application
              value: 'AD DS Performance'
          triggers:
            - uuid: 4ba50e9ab3c548ed9f7670aaf2d9fc64
              expression: 'min(/xAD DS Health and Performance/perf_counter_en[\Database ==> Instances(lsass/NTDSA)\I/O Database Reads Average Latency],5m)>20'
              name: 'I/O Database Reads Average Latency > 20ms on {HOST.NAME}'
              status: DISABLED
              priority: WARNING
              manual_close: 'YES'
        - uuid: a0714f8bb24a482481d5c84f77962b80
          name: 'I/O Log Writes/sec'
          key: 'perf_counter_en[\Database ==> Instances(lsass/NTDSA)\I/O Log Writes/sec]'
