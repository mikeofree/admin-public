  triggers:
    - uuid: 81e710738bc6430597494111df92b43a
      expression: '(last(/xJuniper by SNMP/system.hw.uptime[hrSystemUptime.0])>0 and last(/xJuniper by SNMP/system.hw.uptime[hrSystemUptime.0])<10m) or (last(/xJuniper by SNMP/system.hw.uptime[hrSystemUptime.0])=0 and last(/xJuniper by SNMP/system.net.uptime[sysUpTime.0])<10m)'
      name: 'Juniper: Host has been restarted'
      event_name: 'Juniper: {HOST.NAME} has been restarted (uptime < 10m)'
      priority: WARNING
      description: 'Uptime is less than 10 minutes.'
      manual_close: 'YES'
      dependencies:
        - name: 'Juniper: No SNMP data collection'
          expression: 'max(/xJuniper by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
      tags:
        - tag: scope
          value: notice
