zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: 254649f8e18546eba920ffb94a76fdf3
      template: 'xSNMP - Ricoh'
      name: 'xSNMP - Ricoh'
      description: |
        Works with: 
        
        
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: 297265bd2e784b278c0397ad04170060
          name: 'Toner Black'
          type: CALCULATED
          key: ink.black.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.black.now)/last(//ink.black.max)'
        - uuid: cb0aa7743ec74f12aca70f75f128f6c2
          name: 'Max Toner Black'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ink.black.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 030f55a39ee74859bb7da0ec88f21389
          name: 'Current Toner Black Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ink.black.now
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 410ce2d155644925b678cd7f92880afc
          name: 'Toner Waste'
          type: CALCULATED
          key: ink.waste.absolute
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.waste.now)/last(//ink.waste.max)'
        - uuid: f87fc55e572a42ec844da483a97fd150
          name: 'Current Toner Waste'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.2
          key: ink.waste.current
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: b00dd315caba4fc2a87241d1398ff7f9
          name: 'Max Waste Toner'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.2
          key: ink.waste.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: b1e396c70e6145bf8ec3d21c95b637fa
          name: 'Printer IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.7.2.1.17.0
          key: printer.ip
          delay: 1h
          value_type: CHAR
        - uuid: 1ac520de08f5440c8670110018b9e246
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
          key: printer.model
          delay: 1d
          value_type: CHAR
        - uuid: 86e44430be8f49939d35eb7794a6fa87
          name: 'Printer Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.6.1.1.7.1
          key: printer.name
          delay: 1d
          value_type: CHAR
        - uuid: dfe21f3ed7e149e086c72b1baf7b103a
          name: 'Printer Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.16.5.1.2.1.1
          key: printer.status
          value_type: CHAR
        - uuid: 51444c15410d47b1887d91acbcf85366
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 10m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 71bb84094c62425f8c77d8324bd10018
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 255eb9c2fd004a8c9925c5e5f7bb1dfa
              expression: 'max(/xSNMP - Ricoh/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: Printer
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: c0b6ba617d264db78b223197fc27330c
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: be1796d29fa0403dbee04d0c32428479
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
