zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: 1b6fe7acafa84030815a0b044abef353
      template: 'xSNMP - Ricoh Color'
      name: 'xSNMP - Ricoh Color'
      description: |
        Works with: 
        
        
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: c06d90d4954647e398ade2ff99cf57e6
          name: 'Toner Black'
          type: CALCULATED
          key: ink.black.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.black.now)/last(//ink.black.max)'
        - uuid: 7cb51c012e8c4edb9a9d44fc40775e69
          name: 'Max Toner Black'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ink.black.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: e387227a601f4492a09b0c0ee7f97e59
          name: 'Current Toner Black Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ink.black.now
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: fb0329a186bd411d9ac5b6f001eccfd7
          name: 'Toner Cyan'
          type: CALCULATED
          key: ink.cyan.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.cyan.now)/last(//ink.cyan.max)'
        - uuid: daa6e08587d14569aacb542c8f0db140
          name: 'Max Toner Cyan'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.3
          key: ink.cyan.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: c8a044faaee8430a9a005bcae2ad8409
          name: 'Current Toner Cyan Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.3
          key: ink.cyan.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 24a8fde7b3e748d186a245cf9be87146
          name: 'Toner Magenta'
          type: CALCULATED
          key: ink.magenta.calcualted
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.magenta.now)/last(//ink.magenta.max)'
        - uuid: 1ded39be25ef4ef4ba99f8e870d741be
          name: 'Max Toner Magenta'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.4
          key: ink.magenta.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 2ec426d5f94f4f4eb05fa991a10bb72a
          name: 'Current Toner Magenta Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.4
          key: ink.magenta.now
          delay: 1h
          history: 7d
          value_type: FLOAT
