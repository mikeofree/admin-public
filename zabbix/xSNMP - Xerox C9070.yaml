zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: 6405199bc37d42688c566dd82113104f
      template: 'xSNMP - Xerox C9070'
      name: 'xSNMP - Xerox C9070'
      description: |
        Works with: 
        Phaser
        
        
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: ee0b31b6c6ad49329b24a0b2ad228eb6
          name: 'Printer IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.4.20.1.1.10.20.7.11
          key: printer.ip
          delay: 1h
          value_type: CHAR
        - uuid: 42591ca906eb443e9077405ea52abb8d
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
          key: printer.model
          delay: 1d
          value_type: CHAR
        - uuid: 7d34933f72154c18b03d67dfdec47b8c
          name: 'Printer Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
          key: printer.name
          delay: 1d
          value_type: CHAR
        - uuid: 89f0801c0e1c440ba29b00ea595ece39
          name: 'Printer Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.18.1.1.8.1.7
          key: printer.status
          value_type: CHAR
        - uuid: 53b08319ba474689b59102fee07c239f
          name: 'Printer Toner Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: printer.toner1
          delay: 1h
          value_type: FLOAT
          trends: 31d
          units: '%'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.0142857'
        - uuid: 69c2042f0d334afca76bf5e58c9ced38
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 10m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: c009c7f454b9474e920a369c8c1f9c47
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: d6f4edb458a347f8a5ced696ca7287e2
              expression: 'max(/xSNMP - Xerox C9070/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: Printer
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: adc1de71d96f47a1806b4b7ca0313a8c
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: c1fe7db2c449401c86d2e41a925bbb05
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
