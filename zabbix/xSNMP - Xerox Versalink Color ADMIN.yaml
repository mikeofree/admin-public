zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: 79415b402ceb48b8822b3be27782d239
      template: 'xSNMP - Xerox Versalink Color ADMIN'
      name: 'xSNMP - Xerox Versalink Color ADMIN'
      description: |
        Works with: 
        
        
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: 6d368911e0c4427689f75fa0e948ef11
          name: 'Toner Black'
          type: CALCULATED
          key: ink.black.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.black.now)/last(//ink.black.max)'
        - uuid: 7582fb133227440b83e7e35627eede01
          name: 'Max Toner Black'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ink.black.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 962d9c40da4b49b2b974c0792154d808
          name: 'Current Toner Black Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ink.black.now
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 9af849b73281493eb366a4a0eb3cb040
          name: 'Toner Cyan'
          type: CALCULATED
          key: ink.cyan.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.cyan.now)/last(//ink.cyan.max)'
        - uuid: d14587bfbe434a53beee7ddefe4d2150
          name: 'Max Toner Cyan'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.2
          key: ink.cyan.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 571d2b0f82904eff9c5bec7df7f522ba
          name: 'Current Toner Cyan Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.2
          key: ink.cyan.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 5fd4bf23630948e599f3d40f76ad6bca
          name: 'Toner Magenta'
          type: CALCULATED
          key: ink.magenta.calcualted
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.magenta.now)/last(//ink.magenta.max)'
        - uuid: e6dd594b899d41509c821e9701e03ae9
          name: 'Max Toner Magenta'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.3
          key: ink.magenta.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 051db66814854aaba1299b8165814b32
          name: 'Current Toner Magenta Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.3
          key: ink.magenta.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 01cbc18f5e2e4add929b9356c29bf323
          name: 'Toner Yellow'
          type: CALCULATED
          key: ink.yellow.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.yellow.now)/last(//ink.yellow.max)'
        - uuid: 8b1a8cde0cad4dbe90ddd7d3f27c1d3c
          name: 'Max Toner Yellow'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.4
          key: ink.yellow.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: b2758783a2774594943a35fda2c90984
          name: 'Current Toner Yellow Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.4
          key: ink.yellow.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 78ddcdfdb09e4c199b357e62e755f5d2
          name: 'Printer IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.4.20.1.1.10.20.7.184
          key: printer.ip
          delay: 1h
          value_type: CHAR
        - uuid: cd246c94d4c04200a7314bdce031bfee
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1347.43.5.1.1.1.1
          key: printer.model
          delay: 1d
          value_type: CHAR
        - uuid: d633440f04474f179016bbddd29c669a
          name: 'Printer Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
          key: printer.name
          delay: 1d
          value_type: CHAR
        - uuid: a18b3a6a1fdc48dd92b985647b232a79
          name: 'Printer Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.16.5.1.2.1.2
          key: printer.status
          value_type: CHAR
        - uuid: 69af1d0024d9406d9d001c55606267ed
          name: 'Printer Toner Type'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.6.1.1
          key: printer.toner
          delay: 4h
          value_type: CHAR
        - uuid: 3e5729ee0e03415c856743978d03cb38
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 30s
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 2eb55d23549c49639901ef979fbf6067
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 1cfc61444f7b4805b3c99032d38684cd
              expression: 'max(/xSNMP - Xerox Versalink Color ADMIN/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: Printer
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: 36f1b48149f246d7aa8927829f6cc4bf
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: 25b560f54c5e4770a1352488dd29b018
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
