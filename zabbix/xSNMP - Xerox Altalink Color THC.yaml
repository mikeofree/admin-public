zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: 967115137a5040b4890c81460fd5530c
      template: 'xSNMP - Xerox Altalink Color THC'
      name: 'xSNMP - Xerox Altalink Color THC'
      description: |
        Works with: 
        
        
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: 928cb0c751dc4e4a88601894a6e9342e
          name: 'Toner Black'
          type: CALCULATED
          key: ink.black.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.black.now)/last(//ink.black.max)'
        - uuid: bd439489cec8463299000fe709ea8593
          name: 'Max Toner Black'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ink.black.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: a22b736f3c314695bd90cb6a5ac44b97
          name: 'Current Toner Black Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ink.black.now
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 5b3ead96bb8a41f2993dc913d80f5227
          name: 'Toner Cyan'
          type: CALCULATED
          key: ink.cyan.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.cyan.now)/last(//ink.cyan.max)'
        - uuid: 58b087d275ab4ab08035914b76458289
          name: 'Max Toner Cyan'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.2
          key: ink.cyan.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: a313aab27da9452287c633fc99e2e060
          name: 'Current Toner Cyan Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.2
          key: ink.cyan.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: fb8d29ba176743f1ba1ab3b757eb3090
          name: 'Toner Magenta'
          type: CALCULATED
          key: ink.magenta.calcualted
          delay: 5m
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.magenta.now)/last(//ink.magenta.max)'
        - uuid: 21de0a0b2a9b41e0b7485ea1e63210c6
          name: 'Max Toner Magenta'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.3
          key: ink.magenta.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 211b834aa9f147499eb058a8acc3a2f5
          name: 'Current Toner Magenta Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.3
          key: ink.magenta.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 4c3ea25494364442bb772e8ee18287cc
          name: 'Toner Yellow'
          type: CALCULATED
          key: ink.yellow.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.yellow.now)/last(//ink.yellow.max)'
        - uuid: dc5ea78f47554dfe97eabc137afac2ff
          name: 'Max Toner Yellow'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.4
          key: ink.yellow.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 0034db148f45440fab6a35050de5afbd
          name: 'Current Toner Yellow Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.4
          key: ink.yellow.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: bbb6417b5f3749c3b95165d81be59a6a
          name: 'Printer IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.4.20.1.1.10.81.7.11
          key: printer.ip
          delay: 1h
          value_type: CHAR
        - uuid: 622cd1016f61479ea241e7cfb1a094e7
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1347.43.5.1.1.1.1
          key: printer.model
          delay: 1d
          value_type: CHAR
        - uuid: 9a91bd887f124db1a445815fa8cfb65e
          name: 'Printer Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
          key: printer.name
          delay: 1d
          value_type: CHAR
        - uuid: 3f8e245a67b74cf9a065ac1eac5945d0
          name: 'Printer Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.16.5.1.2.1.2
          key: printer.status
          value_type: CHAR
        - uuid: b3563812a5d4483f92f38293bfbdbbfa
          name: 'Printer Toner Type'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.6.1.1
          key: printer.toner
          delay: 4h
          value_type: CHAR
        - uuid: ee07ed0ff9df48ffbb6e92c83035555d
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 10m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: a53c06ebb7274829955e754021dafd5d
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 3d98ba0366204314b9be6059340bc5b7
              expression: 'max(/xSNMP - Xerox Altalink Color THC/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: Printer
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: ea37f8c7b1f14fe4a5cf568fff6a84f0
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: 8bd26f2fe43d4045bbb151570aa262db
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
