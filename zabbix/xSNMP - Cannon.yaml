zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: f5c53d66c43d42e081e95a99b3013d2f
      template: 'xSNMP - Cannon'
      name: 'xSNMP - Cannon'
      description: |
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: 9f19060c94a54fcb9ba3a0f393f36d7c
          name: 'IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.3.3.1.100.10.1.4.2
          key: canon.ip
          delay: 5m
          value_type: TEXT
        - uuid: d90bd50b4cbc4b8f967f2071956382d3
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.3.2.1.3.1
          key: canon.model
          delay: 1h
          value_type: TEXT
        - uuid: 8cfa3e8e91ea4d9eacf44e6c7f9c2970
          name: Status
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.16.5.1.2.1.1
          key: canon.status
          delay: 1h
          value_type: TEXT
        - uuid: 991e6fe338db45fbb4a6c11555ab2875
          name: 'Toner Black'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: canon.toner.black.level
          delay: 1h
          units: '%'
        - uuid: 19ea309329954f859a900ac19ca3465a
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 10m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 5cf11a9d432747c39e28e65fafbe64d5
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 746ae72dd93745f9988401be4bb51e2b
              expression: 'max(/xSNMP - Cannon/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: Printer
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMPV3_NAME}'
          value: zabbix
        - macro: '{$SNMPV3_PASSWORD}'
          value: public
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: 49f0f35bdc2849e5a4bc2d0e1c81f873
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: bf54fe8d2f574fdd91689b179c1510a9
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
