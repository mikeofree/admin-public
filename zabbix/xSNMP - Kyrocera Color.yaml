zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: 983700d7fe244a918aa4d83636276375
      template: 'xSNMP - Kyrocera Color'
      name: 'xSNMP - Kyrocera Color'
      description: |
        Works with: 
        ECOSYS P3145dn
        
        
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: 4ec2496ad7414d5982e763045e96bfc7
          name: 'Toner Black'
          type: CALCULATED
          key: ink.black.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.black.now)/last(//ink.black.max)'
        - uuid: ff0f207c94f847c1ab2805791562fa6a
          name: 'Max Toner Black'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.4
          key: ink.black.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 4bde00af20a34bdda4a803909b60e18f
          name: 'Current Toner Black Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.4
          key: ink.black.now
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: c685a96f0f754fcc9229597a49370fd6
          name: 'Toner Cyan'
          type: CALCULATED
          key: ink.cyan.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.cyan.now)/last(//ink.cyan.max)'
        - uuid: edd0bb7279364303b780d1e419b36efd
          name: 'Max Toner Cyan'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ink.cyan.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 69dc7fe457c14f088df5539e000ec4a7
          name: 'Current Toner Cyan Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ink.cyan.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 478e7717fd494d74bbe31af6001f8d62
          name: 'Toner Magenta'
          type: CALCULATED
          key: ink.magenta.calcualted
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.magenta.now)/last(//ink.magenta.max)'
        - uuid: c8613046efd84a37993cf8fae4a15d70
          name: 'Max Toner Magenta'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.2
          key: ink.magenta.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: ff1c649a132b4788bf322ea53fd91dc6
          name: 'Current Toner Magenta Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.2
          key: ink.magenta.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 6df65a10cb2f43e1b155b4e2036ab166
          name: 'Toner Yellow'
          type: CALCULATED
          key: ink.yellow.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.yellow.now)/last(//ink.yellow.max)'
        - uuid: e478dc951dd94e51918897608a44a45b
          name: 'Max Toner Yellow'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.3
          key: ink.yellow.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: c97f96b149224f6893bb82d19aae473b
          name: 'Current Toner Yellow Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.3
          key: ink.yellow.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 5a772abf5597428cb67dbfd0870505a8
          name: 'Printer IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1347.40.10.1.1.4.1
          key: printer.ip
          delay: 1h
          value_type: CHAR
        - uuid: 7180b9ed610b4e879f64e47c74f03a51
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1347.43.5.1.1.1.1
          key: printer.model
          delay: 1d
          value_type: CHAR
        - uuid: 7a5780161f924a88a0ead5f5d9a03fde
          name: 'Printer Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1347.40.10.1.1.5.1
          key: printer.name
          delay: 1d
          value_type: CHAR
        - uuid: 64b6e62d81e4425795097c5005b1bf5c
          name: 'Printer Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1347.43.18.2.1.2.1.1
          key: printer.status
          value_type: CHAR
        - uuid: d1650c19e9304fc495431008e9903684
          name: 'Printer Toner Type'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.6.1.1
          key: printer.toner
          delay: 4h
          value_type: CHAR
        - uuid: e06a33b2ccd24c4982c5d4e4064401e4
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 10m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 479127b21bd54e7f90c892def05b2175
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: a07203a03ccb42f396ffd9e0424fea14
              expression: 'max(/xSNMP - Kyrocera Color/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: Printer
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: da58aa9e60b54a3d84bdc6f0249eeeab
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: 89539251943042d1aa49c9c1b7d86998
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
