zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: 59711ce53faf45368386ab2cf2491cd1
      template: 'xSNMP - Xerox'
      name: 'xSNMP - Xerox'
      description: |
        Works with: 
        
        
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: 2230838192c64fefa58f8fc6419a5027
          name: 'Toner Black'
          type: CALCULATED
          key: ink.black.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.black.now)/last(//ink.black.max)'
        - uuid: a56a836fb6ea48baa570e7192361eaa7
          name: 'Max Toner Black'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ink.black.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 610a9d653e524667ba8d30a87ef60452
          name: 'Current Toner Black Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ink.black.now
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: ee8ee33b55614b59b513b8a9de00b1c2
          name: 'Printer IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.4.20.1.1.10.20.7.18
          key: printer.ip
          delay: 1h
          value_type: CHAR
        - uuid: 3b4baed2be4d4e4796c1e7b13662289d
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1347.43.5.1.1.1.1
          key: printer.model
          delay: 1d
          value_type: CHAR
        - uuid: 01afd047eaf14c27bcbbcda15d94d78b
          name: 'Printer Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
          key: printer.name
          delay: 1d
          value_type: CHAR
        - uuid: 87c008876c0f44cfabacc92fbc4dfdaf
          name: 'Printer Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.16.5.1.2.1.2
          key: printer.status
          value_type: CHAR
        - uuid: a991e4892c50451a84aa6816bdc23929
          name: 'Printer Toner Type'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.6.1.1
          key: printer.toner
          delay: 4h
          value_type: CHAR
        - uuid: d7c5520536b54b18b9d5097d37aa5188
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 10m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: fac7eb9d0262498cb8c8b5c16ac39977
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: b81360f33eac4c82bc0203abedcd3ff6
              expression: 'max(/xSNMP - Xerox/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: Printer
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: 869e0c406eb04d6892ba5315d294f13a
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: 0d254d15c8c047d7b3962cb6b996ad82
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
