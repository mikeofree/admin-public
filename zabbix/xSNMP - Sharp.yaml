zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 08ad08f6491047718d09263a79bebfba
      name: MT
  templates:
    - uuid: a4b8ecdcd0604a809aa9fc49d8f1b6e1
      template: 'xSNMP - Sharp'
      name: 'xSNMP - Sharp'
      description: |
        Works with: 
        
        
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: MT
      items:
        - uuid: b0d6b5e5f9084a41b21f7f83769f7183
          name: 'Toner Black'
          type: CALCULATED
          key: ink.black.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.black.now)/last(//ink.black.max)'
        - uuid: 7860194a6ad04291bf76bc81c29931f5
          name: 'Max Toner Black'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.4
          key: ink.black.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 944b1423a6f04f698d331c344ced6d30
          name: 'Current Toner Black Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.4
          key: ink.black.now
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 18b46d8016644e7991e4ca9b60079519
          name: 'Toner Cyan'
          type: CALCULATED
          key: ink.cyan.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.cyan.now)/last(//ink.cyan.max)'
        - uuid: 085774af2bbd4681b9188d8c53d116a2
          name: 'Max Toner Cyan'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ink.cyan.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 1f12e1be00e74d449685fba0b3a227f1
          name: 'Current Toner Cyan Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ink.cyan.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: fb6fd3388f194694a7f4344978e098fd
          name: 'Toner Magenta'
          type: CALCULATED
          key: ink.magenta.calcualted
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.magenta.now)/last(//ink.magenta.max)'
        - uuid: be565f6d5f1b43aabe10757bffba58a1
          name: 'Max Toner Magenta'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.2
          key: ink.magenta.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 3c3819da900b4b01a748565624a9dee7
          name: 'Current Toner Magenta Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.2
          key: ink.magenta.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 7318e78538184e71b30bb566ea239fe2
          name: 'Toner Yellow'
          type: CALCULATED
          key: ink.yellow.calculated
          delay: 1h
          history: 7d
          trends: 7d
          units: '%'
          params: '100*last(//ink.yellow.now)/last(//ink.yellow.max)'
        - uuid: 7dfda155f76441bfbba24df16f65c260
          name: 'Max Toner Yellow'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.3
          key: ink.yellow.max
          delay: 1h
          history: 7d
          trends: 7d
        - uuid: 3ecc9f6f18a8433e812aa89ee21d8c71
          name: 'Current Toner Yellow Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.3
          key: ink.yellow.now
          delay: 1h
          history: 7d
          value_type: FLOAT
          trends: 7d
        - uuid: 27325ba6bd8a490ea723fd30b17a32e8
          name: 'Printer IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.4.20.1.1.10.10.7.103
          key: printer.ip
          delay: 1h
          value_type: CHAR
        - uuid: 32c1823955724c52a68fbc29db1ee53d
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: printer.model
          delay: 1d
          value_type: CHAR
        - uuid: b5e3e27af55940328f52e2c75bb5f52c
          name: 'Printer Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: printer.name
          delay: 1d
          value_type: CHAR
        - uuid: e7accfc01e844d19a021415c11820de3
          name: 'Printer Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.17.6.1.5.1.1
          key: printer.status
          value_type: CHAR
        - uuid: e7f4e686507140b98080b9a0315f14d7
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 10m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: cc3a563afcaa4e4cae1dec3fd3a6198d
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          trends: 31d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 2f947a4ead874d2284a014599c660d1b
              expression: 'max(/xSNMP - Sharp/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP Ping!'
                  expression: 'max(/xICMP Ping -BASE-/icmpping[{HOST.HOST}],#3)=0'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: Device
          value: Printer
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: 6d80fd8ef11f47229016e24b131f20d5
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: 2fbd5797c719496c90f5fa9b9aff882f
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
