            - uuid: fb4d784d62cc4fc18f090f43f07ba634
              name: 'VPN Uptime {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.8741.8.1.5.5.1.5.{#SNMPINDEX}'
              key: 'tunnelServiceSslTunnelUpTime[{#SNMPINDEX}]'
              delay: '60'
              history: 7d
              value_type: TEXT
              description: 'Uptime statistics for this tunnel service SSL tunnel.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // Input is seconds (Zabbix passes it as "value")
                      var seconds = parseInt(value);
                      
                      // Calculate days, hours, minutes
                      var days = Math.floor(seconds / 86400);
                      var hours = Math.floor((seconds % 86400) / 3600);
                      var minutes = Math.floor((seconds % 3600) / 60);
                      
                      // Format output
                      return days + "d " + hours + "h " + minutes + "m";
              tags:
                - tag: Application
                  value: 'SONICWALL-SMA-APPLIANCE-TUNNEL-SERVER-MIB::sonicwallTunnelServer'
                - tag: x
                  value: 'VPN User Uptime'
